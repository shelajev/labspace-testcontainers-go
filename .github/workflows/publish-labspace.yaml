name: Package and deploy Labspace

env:
  DOCKERHUB_REPO: olegselajev241/labspace-testcontainers-go

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Labspace
        uses: dockersamples/publish-labspace-action@6d55204848c70c76b7df17f8c8fb20c2b24a8b00 # v2
        with:
          target_repo: ${{ env.DOCKERHUB_REPO }}
